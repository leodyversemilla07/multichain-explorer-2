[pytest]
# pytest configuration for MultiChain Explorer 2

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto

# Markers for test organization (registered)
markers =
    unit: Unit tests (fast, no external dependencies)
    integration: Integration tests (may require MultiChain node)
    slow: Slow tests (> 1 second)
    security: Security-related tests
    smoke: Smoke tests for quick validation

# Output
addopts = 
    -v
    --tb=short
    --timeout=5

# Warnings
filterwarnings =
    ignore::UserWarning
    ignore::DeprecationWarning
    ignore::pydantic.warnings.PydanticDeprecatedSince20

[coverage:run]
omit = 
    */tests/*
    */venv/*
    */virtualenv/*
    setup.py
    
[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
